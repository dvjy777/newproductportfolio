<!doctype html>
<html lang="en">
<head>

<style>
  @font-face{ font-family:'Geist'; src:url('../fonts/Geist-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'Geist'; src:url('../fonts/Geist-Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }
  @font-face{ font-family:'Geist Mono'; src:url('../fonts/GeistMono-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
  @font-face{ font-family:'Geist Mono'; src:url('../fonts/GeistMono-Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }

  :root{ --bg:#050506; --ink:#f2f3f5; --soft:rgba(255,255,255,.66); --muted:#8e939e; --dim:#5b606b; --accent:#a9c1ff; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden; }
  body{ font-family:'Geist', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; }
  .mono{ font-family:'Geist Mono', ui-monospace, monospace; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; }

  /* ---------- backdrop: the work itself ----------
     At rest, a slow aurora in the four project colours; the one on air in the island glows a little brighter.
     Point at a project and its own footage takes over, blurred and smeared sideways, so the glass glows with it. */
  .space{ position:fixed; inset:0; overflow:hidden; pointer-events:none; }
  .aurora{ position:absolute; inset:-10%; opacity:0; transition:opacity 2.4s ease; }
  .ready .aurora{ opacity:1; }
  .blob{ position:absolute; width:52vmax; height:52vmax; border-radius:50%; filter:blur(80px); opacity:.42; scale:1; transition:opacity 1.6s ease, scale 2s ease; }
  .blob.claude{ left:8%; top:4%; background:radial-gradient(circle, #d97757, transparent 62%); animation:drift-a 27s ease-in-out infinite alternate; }
  .blob.chance-ai{ right:4%; top:0; background:radial-gradient(circle, #1d5fff, transparent 62%); animation:drift-b 31s ease-in-out infinite alternate; }
  .blob.inyun{ left:18%; bottom:-6%; background:radial-gradient(circle, #e8456b, #f5b96e 30%, transparent 62%); animation:drift-b 35s ease-in-out infinite alternate-reverse; }
  .blob.ekpyrosis{ right:14%; bottom:-10%; background:radial-gradient(circle, #ffd1dc, #d9476b 28%, transparent 62%); animation:drift-a 29s ease-in-out infinite alternate-reverse; }
  .space[data-live="claude"] .blob.claude, .space[data-live="chance-ai"] .blob.chance-ai,
  .space[data-live="inyun"] .blob.inyun, .space[data-live="ekpyrosis"] .blob.ekpyrosis{ opacity:.72; scale:1.18; }
  @keyframes drift-a{ to{ transform:translate(9vmax, 7vmax); } }
  @keyframes drift-b{ to{ transform:translate(-8vmax, 6vmax); } }
  .footage{ position:absolute; left:50%; top:calc(var(--island-top, 36vh) + 14vh); width:min(150vmin, 1500px); height:120vh; transform:translate(-50%, -50%); }
  .footage > *{ position:absolute; left:50%; top:50%; height:100%; width:auto; max-width:none; transform:translate(-50%, -50%) scaleX(2.1) scaleY(1.05);
    filter:blur(46px) saturate(1.6) brightness(.62) contrast(1.15); opacity:0; transition:opacity 1s ease; }
  .footage img{ width:70%; height:auto; transform:translate(-50%, -50%) scaleX(1.4) scaleY(2.6); }
  .footage > .on{ opacity:.85; }
  .wash{ position:absolute; inset:0; mix-blend-mode:color; opacity:0; transition:opacity 1s ease; }
  .wash.on{ opacity:.85; }
  .open .liquid{ background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.03) 65%), linear-gradient(rgba(10,10,14,.42), rgba(10,10,14,.42)); }
  .vignette{ position:absolute; inset:0; background:radial-gradient(ellipse 70% 75% at 50% calc(var(--island-top, 36vh) + 12vh), rgba(5,5,6,0) 35%, rgba(5,5,6,.65) 75%, #050506); }

  /* ---------- chrome ---------- */
  .top{ position:fixed; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center; padding:22px max(20px, env(safe-area-inset-left)); z-index:6; }
  .top .name{ color:var(--ink); text-decoration:none; }
  .top .name span{ display:block; color:var(--dim); margin-top:4px; }
  .top a.classic{ white-space:nowrap; color:var(--muted); text-decoration:none; padding:8px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.1); transition:color .2s, border-color .2s; }
  .top a.classic:hover{ color:var(--ink); border-color:rgba(255,255,255,.25); }
  .bottom{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; flex-wrap:wrap; gap:8px 22px; padding:22px 20px max(22px, env(safe-area-inset-bottom)); z-index:2; color:var(--dim); }
  .bottom button, .bottom a{ font:inherit; letter-spacing:inherit; text-transform:inherit; background:none; border:0; color:inherit; cursor:pointer; padding:6px 2px; text-decoration:none; transition:color .2s; }
  .bottom button:hover, .bottom a:hover{ color:var(--ink); }
  .bottom .after{ display:none; }
  .done .bottom .during{ display:none; }
  .done .bottom .after{ display:inline-block; }
  .top, .bottom{ opacity:0; transition:opacity 1.2s ease .4s; }
  .ready .top, .ready .bottom{ opacity:1; }
  .expanded .bottom{ opacity:0; pointer-events:none; }

  /* lines that keep turning under the island once the projects are up */
  .caption{ position:fixed; left:50%; transform:translateX(-50%); width:min(520px, calc(100vw - 40px)); margin:0; text-align:center; z-index:2;
    font-size:13px; line-height:1.5; color:var(--muted); opacity:0; transition:opacity .6s ease; pointer-events:none; }
  .caption.on{ opacity:1; }
  .caption .mono{ font-size:10.5px; color:var(--dim); }
  .open .caption, .expanded .caption{ opacity:0 !important; }

  /* ---------- liquid glass ---------- */
  .liquid{ position:fixed; inset:0; z-index:3; pointer-events:none; clip-path:path('M0 0Z');
    -webkit-backdrop-filter:blur(26px) saturate(170%) brightness(1.15); backdrop-filter:blur(26px) saturate(170%) brightness(1.15);
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04) 65%), linear-gradient(rgba(10,10,14,.26), rgba(10,10,14,.26)); }
  /* the rim catches the light from wherever the pointer is */
  .rim{ position:fixed; z-index:4; pointer-events:none; left:0; top:0; --hx:0px; --hy:1px; --px:30%; --py:0%; --la:140deg;
    box-shadow:inset var(--hx) var(--hy) 1px rgba(255,255,255,.5), inset calc(var(--hx) * -1) calc(var(--hy) * -1) 1px rgba(255,255,255,.10),
      inset 0 0 24px rgba(255,255,255,.07), inset 0 0 0 .5px rgba(255,255,255,.22), 0 18px 44px rgba(0,0,0,.35); }
  .rim::before{ content:''; position:absolute; inset:0; border-radius:inherit;
    background:radial-gradient(90% 70% at var(--px) var(--py), rgba(255,255,255,.16), rgba(255,255,255,0) 60%),
      linear-gradient(var(--la), rgba(255,255,255,.10), rgba(255,255,255,0) 34%, rgba(255,255,255,0) 74%, rgba(255,255,255,.05)); }
  .rim.island{ opacity:0; transition:opacity .5s ease; }
  .ready .rim.island{ opacity:1; }

  .island-c{ position:fixed; z-index:5; left:0; top:0; overflow:hidden; }
  .photo{ position:absolute; left:6px; top:50%; width:36px; height:36px; margin-top:-18px; border-radius:50%; overflow:hidden;
    filter:grayscale(1) contrast(1.06) brightness(.92); transition:opacity .45s ease, transform .6s cubic-bezier(.34,1.32,.5,1); }
  .photo canvas{ width:100%; height:100%; display:block; image-rendering:pixelated; }
  .is-icons .photo{ opacity:0; transform:scale(.6); }

  .say{ margin:0; position:absolute; left:56px; right:22px; top:50%; transform:translateY(-50%); font-size:14.5px; line-height:1.5; letter-spacing:.005em; color:var(--soft); }
  .say .w{ display:inline-block; opacity:0; filter:blur(5px); transform:translateY(4px); transition:opacity .5s ease, filter .5s ease, transform .5s cubic-bezier(.32,.72,0,1); transition-delay:calc(var(--i) * 40ms); }
  .say.in .w{ opacity:1; filter:none; transform:none; }
  .say.out .w{ opacity:0; filter:blur(4px); transform:translateY(-3px); transition-duration:.35s; transition-delay:calc(var(--i) * 10ms); }
  .say .w.em{ color:#fff; }

  /* the project bar: four icons, then a live activity like the island on a phone */
  .bar{ position:absolute; left:0; top:0; height:100%; display:flex; align-items:center; gap:8px; padding:0 6px; white-space:nowrap; }
  .ico{ position:relative; width:40px; height:40px; flex:0 0 40px; border-radius:50%; border:0; padding:0; cursor:pointer; color:inherit; touch-action:manipulation;
    background:rgba(255,255,255,.04); box-shadow:inset 0 .5px 0 rgba(255,255,255,.18), inset 0 0 0 .5px rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.4); -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    transition:opacity .4s ease, transform .55s cubic-bezier(.34,1.32,.5,1), background .25s ease, box-shadow .3s ease; transition-delay:calc(var(--i) * 70ms + .2s); }
  .is-icons .ico{ opacity:1; transform:none; }
  .ico svg{ width:21px; height:21px; display:block; transition:transform .35s cubic-bezier(.34,1.32,.5,1); }
  .ico:hover svg, .ico.on svg, .ico:focus-visible svg{ transform:scale(1.14); }
  .ico.on{ background:rgba(255,255,255,.12); }
  .ico.live:not(.on){ box-shadow:inset 0 .5px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(255,255,255,.22); }
  .ico:focus-visible{ outline:1.5px solid var(--accent); outline-offset:2px; }
  body:not(.is-icons) .ico{ pointer-events:none; transition-delay:0s; }
  /* holding fills a ring around the icon */
  .ico::after{ content:''; position:absolute; inset:-3px; border-radius:50%; pointer-events:none; opacity:0;
    background:conic-gradient(#fff calc(var(--hold, 0) * 1turn), transparent 0); -webkit-mask:radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); mask:radial-gradient(closest-side, transparent calc(100% - 2px), #000 calc(100% - 1.5px)); }
  .ico.holding::after{ opacity:.9; }

  .sep{ width:1px; height:22px; margin:0 4px; background:rgba(255,255,255,.12); opacity:0; transition:opacity .4s ease .5s; }
  .act{ position:relative; width:var(--actw, 206px); height:40px; opacity:0; transition:opacity .4s ease .55s; }
  .is-icons .sep, .is-icons .act{ opacity:1; }
  .act-in{ position:absolute; inset:0; display:flex; align-items:center; gap:10px; padding-right:12px; transition:opacity .3s ease, transform .4s cubic-bezier(.32,.72,0,1); }
  .act-in.leave{ opacity:0; transform:translateY(-6px); }
  .act-in.enter{ opacity:0; transform:translateY(6px); }
  .act .glyph{ width:26px; height:26px; flex:0 0 26px; position:relative; }
  .act .txt{ min-width:0; display:flex; flex-direction:column; gap:2px; }
  .act .lbl{ font-size:9.5px; color:var(--muted); }
  .act .lbl i{ display:inline-block; width:5px; height:5px; border-radius:50%; background:#5ee08a; margin-right:6px; vertical-align:1px; animation:pulse 1.6s ease-in-out infinite; font-style:normal; }
  @keyframes pulse{ 50%{ opacity:.35; } }
  .act .val{ font-size:12.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* tiny live scenes, one per project */
  .g-branch path{ fill:none; stroke:#d97757; stroke-width:1.6; stroke-linecap:round; stroke-dasharray:30; stroke-dashoffset:30; animation:draw 2.4s ease-out infinite; }
  .g-branch path:nth-child(2){ animation-delay:.35s; } .g-branch path:nth-child(3){ animation-delay:.7s; }
  .g-branch circle{ fill:#d97757; }
  @keyframes draw{ 40%, 100%{ stroke-dashoffset:0; } }
  .g-build{ display:flex; align-items:center; }
  .g-build b{ display:block; width:26px; height:4px; border-radius:2px; background:rgba(255,255,255,.12); overflow:hidden; position:relative; }
  .g-build b::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg, #9db8ff, #1d5fff); transform-origin:0 50%; animation:fill 2.6s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes fill{ from{ transform:scaleX(.08); } 80%, to{ transform:scaleX(1); } }
  .g-pair span{ position:absolute; top:7px; width:12px; height:12px; border-radius:50%; filter:blur(.3px); }
  .g-pair span:first-child{ left:0; background:radial-gradient(circle at 35% 30%, #ffd7c2, #f5b96e 50%, #e8456b); animation:meet-l 2.4s ease-in-out infinite alternate; }
  .g-pair span:last-child{ right:0; background:radial-gradient(circle at 35% 30%, #c9d6ff, #8fb0ff 50%, #6b5bd9); animation:meet-r 2.4s ease-in-out infinite alternate; }
  @keyframes meet-l{ to{ transform:translateX(5px); } } @keyframes meet-r{ to{ transform:translateX(-5px); } }
  .g-orb{ border-radius:50%; background:radial-gradient(circle, #fff, #ffd1dc 30%, rgba(217,71,107,.6) 60%, transparent 72%); animation:breathe 3.2s ease-in-out infinite; }
  @keyframes breathe{ 50%{ transform:scale(.72); opacity:.75; } }

  /* ---------- the card that drips out ---------- */
  .card{ position:fixed; z-index:4; left:0; top:0; overflow:hidden; text-decoration:none; color:var(--ink); display:block; opacity:0; pointer-events:none;
    transition:opacity .16s ease; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .card.live{ pointer-events:auto; }
  .card.show{ opacity:1; transition:opacity .35s ease .3s; }
  .card.show.swap{ transition:opacity .25s ease .1s; }
  .card .media{ position:relative; height:150px; margin:6px 6px 0; border-radius:18px; overflow:hidden; }
  .card .media .phone{ position:absolute; left:50%; top:16px; width:80px; margin-left:-40px; border-radius:14px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.45), 0 0 0 .5px rgba(255,255,255,.12); }
  .card .media .phone video, .card .media .phone img{ display:block; width:100%; }
  .card .media .desk{ position:absolute; left:18px; right:-30px; top:18px; border-radius:9px; overflow:hidden; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  .card .media .desk img{ display:block; width:100%; }
  .card .body{ padding:14px 18px 0; }
  .card .co{ color:var(--muted); font-size:10.5px; }
  .card h2{ margin:7px 0 5px; font-size:16.5px; line-height:1.3; font-weight:500; letter-spacing:-.005em; }
  .card p{ margin:0; color:var(--muted); font-size:12.5px; line-height:1.5; }
  .card .foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 18px 16px; font-size:10.5px; }
  .card .go{ color:var(--accent); }
  .card .go i{ font-style:normal; display:inline-block; transition:transform .25s ease; }
  .card:hover .go i{ transform:translateX(4px); }
  .card .hold{ position:relative; color:var(--dim); padding-bottom:5px; }
  .card .hold::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:1.5px; border-radius:1px; background:#fff; transform-origin:0 50%; transform:scaleX(var(--hold, 0)); }
  .rim.drop{ opacity:0; transition:opacity .2s ease; }
  .rim.drop.on{ opacity:1; transition:opacity .3s ease .2s; }

  /* ---------- hold: the card swells into a sheet with the real thing inside ---------- */
  .sheet{ position:fixed; z-index:4; left:0; top:0; overflow:hidden; display:flex; flex-direction:column; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .expanded .sheet{ opacity:1; pointer-events:auto; transition:opacity .4s ease .35s; }
  .expanded .card{ opacity:0 !important; pointer-events:none !important; }
  .sheet-head{ display:flex; align-items:center; gap:14px; padding:14px 14px 10px 20px; }
  .sheet-head .t{ flex:1; min-width:0; }
  .sheet-head .co{ color:var(--muted); font-size:10.5px; }
  .sheet-head h2{ margin:4px 0 0; font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sheet-head a.go{ color:var(--accent); font-size:10.5px; text-decoration:none; white-space:nowrap; }
  .sheet-head button{ width:30px; height:30px; border-radius:50%; border:0; cursor:pointer; color:var(--ink); font-size:15px; line-height:1;
    background:rgba(255,255,255,.08); box-shadow:inset 0 .5px 0 rgba(255,255,255,.2); }
  .sheet-head button:hover{ background:rgba(255,255,255,.16); }
  .sheet-body{ position:relative; flex:1; margin:0 8px 8px; border-radius:18px; overflow:hidden; background:rgba(0,0,0,.35); }
  .sheet-body iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; background:#0b0b0e; }
  .sheet-body video{ position:absolute; left:50%; top:50%; height:94%; transform:translate(-50%, -50%); border-radius:22px; box-shadow:0 20px 50px rgba(0,0,0,.5); }

  @media (prefers-reduced-motion: reduce){
    .blob, .g-branch path, .g-build b::after, .g-pair span, .g-orb, .act .lbl i{ animation:none !important; }
    .say .w, .ico, .photo{ transition-duration:.01s !important; transition-delay:0s !important; }
  }
  @media (max-width:560px){ .say{ font-size:13.5px; } }
</style>
</head>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hover = window.matchMedia && window.matchMedia('(hover: hover)').matches;
  var root = document.documentElement, body = document.body;
  var liquid = document.getElementById('liquid'), rimI = document.getElementById('rimIsland'), rimD = document.getElementById('rimDrop');
  var island = document.getElementById('island'), say = document.getElementById('say'), iconsEl = document.getElementById('icons');
  var bar = document.getElementById('bar'), act = document.getElementById('act'), caption = document.getElementById('caption');
  var card = document.getElementById('card'), sheet = document.getElementById('sheet'), space = document.getElementById('space'), footage = document.getElementById('footage');

  // the opening is short: one line about the work, then the projects; the rest keeps turning underneath
  var opening = ['I design <em>products, AI agents,</em> and <em>spatial experiences.</em>', 'Here are my <em>latest projects.</em>'];
  var turning = [
    '<span class="mono">' + (hover ? 'Hover a project · hold to try it' : 'Tap a project · hold to try it') + '</span>',
    'I\'ve lately been exploring the intersection of affective computing and brain-computer interfaces.',
    'I make music, travel, and make films in my free time.'
  ];

  // the Claude spark, the same uneven rays as the case study banner
  function spark(color){
    var lens = [40, 33, 44, 30, 42, 35, 46, 31, 41, 37, 44], rays = '';
    lens.forEach(function(l, i){
      var a = (i / lens.length) * Math.PI * 2 + (i % 2 ? .06 : -.04) - Math.PI / 2;
      rays += '<line x1="'+(50 + Math.cos(a) * 5).toFixed(1)+'" y1="'+(50 + Math.sin(a) * 5).toFixed(1)+'" x2="'+(50 + Math.cos(a) * l).toFixed(1)+'" y2="'+(50 + Math.sin(a) * l).toFixed(1)+'"/>';
    });
    return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="'+color+'" stroke-width="8.5" stroke-linecap="round">'+rays+'</g></svg>';
  }
  var projects = [
    { slug:'claude', company:'Claude', title:'Side Quests: wander off, never lose the main story',
      blurb:'Highlight a phrase in Claude\'s answer, ask about it on the side, then decide what to keep.',
      icon:spark('#D97757'),
      media:'<div class="desk"><img src="../images/claude/desktop-side-chat.jpg" alt=""></div>',
      bg:'radial-gradient(ellipse 80% 90% at 50% 20%, rgba(217,119,87,.35), rgba(217,119,87,0) 70%), #1c1714',
      footage:{ img:'../images/claude/desktop-side-chat.jpg' },
      proto:'../claude-prototype/hero.html', hold:'Hold to try it',
      live:{ glyph:'<svg class="g-branch" viewBox="0 0 26 26"><path d="M5 22V4"/><path d="M5 15c0-4 4-5 9-5"/><path d="M5 9c0-3 6-4 14-4"/><circle cx="5" cy="22" r="2"/></svg>', lbl:'Side quest', val:'“packed by mid-morning”' } },

    else if(body.classList.contains('is-icons')){ closeCard(true); setIsland(projectBarWidth(), BAR_H); }
    render();
  });
  root.style.setProperty('--island-top', topY() + 'px');

  document.getElementById('skip').addEventListener('click', function(){ showProjects(); });
  document.getElementById('replay').addEventListener('click', function(){ intro(); });

  render();
  var seen = false; try{ seen = sessionStorage.getItem('spatialSeen') === '1'; }catch(e){}
  if(seen || reduce){ body.classList.add('ready'); setIsland(DOT, DOT); setTimeout(function(){ pixelate(16); showProjects(); }, 300); }
  else intro();
})();
</script>
</body>
</html>
