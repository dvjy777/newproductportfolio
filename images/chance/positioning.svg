<line x1="1418" y1="770" x2="850" y2="770" stroke="#8A8A8A" stroke-width="2.5"/>
<path d="M864 759 L848 770 L864 781" fill="none" stroke="#8A8A8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
