<circle cx="560.0" cy="870.0" r="30.0" fill="#E60023"/>
<text x="604" y="870" font-size="25" font-weight="400" fill="#333" dominant-baseline="middle">Pinterest Lens</text>
<circle cx="1450.0" cy="770.0" r="30.0" fill="#1D5FFF"/>
