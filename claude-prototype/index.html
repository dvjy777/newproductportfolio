<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anchored Branching Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
<style>
:root{
  /* Layout: phone stage on the left, a narrow control rail on the right; on a real phone the app fills the screen */
  --page:#141312; --app:#1F1E1D; --surface:#2A2927; --raised:#353431; --line:#3A3936;
  --ink:#F5F4EF; --muted:#A6A39A; --faint:#75726B; --accent:#D97757; --accent-soft:rgba(217,119,87,.16);
  --glass:rgba(255,255,255,.075); --glass-strong:rgba(46,45,42,.68); --glass-line:rgba(255,255,255,.16);
  --hl-coral:#D97757; --hl-amber:#E3A857; --hl-green:#7BBF8A; --hl-blue:#6FA3E0; --hl-violet:#A98BE0;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --slow:1; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0}
img{max-width:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cin:focus-visible,.mcomp input:focus-visible,.search input:focus-visible{outline:none}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:40px;max-width:1120px;margin:0 auto;padding-block:28px 40px;align-items:start}
@media (max-width:880px){.app{grid-template-columns:minmax(0,1fr);gap:24px}}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
#phoneWrap{width:100%;position:relative}
.caption{min-height:48px;max-width:440px;text-align:center;font:400 15px/22px var(--serif);color:var(--muted);text-wrap:balance;transition:opacity .25s}
.caption b{color:var(--ink);font-weight:500}

/* iPhone frame */
.phone{box-sizing:border-box;position:absolute;top:0;left:50%;width:419px;height:878px;padding:13px;border-radius:70px;background:#050505;box-shadow:0 0 0 1.5px #57544F,0 0 0 4px #24231F,0 0 0 5px #3E3C38,0 40px 90px rgba(0,0,0,.6);transform-origin:top center}
.phone::before{content:"";position:absolute;left:-7px;top:168px;width:3px;height:214px;border-radius:2px 0 0 2px;background:linear-gradient(#3E3C38 0 34px,transparent 34px 62px,#3E3C38 62px 128px,transparent 128px 148px,#3E3C38 148px 214px)}
.phone::after{content:"";position:absolute;right:-7px;top:232px;width:3px;height:104px;border-radius:0 2px 2px 0;background:#3E3C38}
.island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:18px;background:#000;z-index:96;pointer-events:none}

/* rail */
.rail{display:flex;flex-direction:column;gap:22px;min-width:0;position:sticky;top:24px}
.eyebrow{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.rail h1{font:500 30px/34px var(--serif);margin:6px 0 8px;text-wrap:balance}
.rail p.lead{font:400 14px/21px var(--sans);color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:2px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;text-align:left;padding:10px 12px;border-radius:12px;color:var(--muted)}
.item .n{font:500 12px var(--sans);color:var(--faint);padding-top:2px;font-variant-numeric:tabular-nums}
.item b{display:block;font:500 14px/19px var(--sans);color:var(--ink)}
.item span.d{display:block;font:400 12.5px/17px var(--sans);margin-top:2px}
.item:hover{background:rgba(255,255,255,.04)}
.item.on{background:var(--surface)}
.item.on .n{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:36px;padding:0 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);font:500 13px var(--sans);display:inline-flex;align-items:center;gap:6px}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--app);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card h2{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.task{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;font:400 13.5px/19px var(--sans)}
.task .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center;margin-top:1px}
.task.done .box{background:var(--accent);border-color:var(--accent)}
.task.done .t{color:var(--muted)}
.task .time{font:500 12px var(--sans);color:var(--accent);font-variant-numeric:tabular-nums}
.log{max-height:220px;overflow:auto;font:400 12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.log div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px}
.log div span:first-child{color:var(--faint);font-variant-numeric:tabular-nums}
details.card summary{cursor:pointer;font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
details.card ul{margin:10px 0 0;padding-left:18px;font:400 13px/20px var(--sans);color:var(--muted)}
details.card li b{color:var(--ink);font-weight:500}

/* ---------- phone screen ---------- */
.screen{--top:58px;--bot:38px;position:relative;width:393px;height:852px;border-radius:57px;overflow:hidden;background:var(--app);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;isolation:isolate}
.screen.demo *{pointer-events:none!important}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.statusbar{position:absolute;inset:0 0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 52px;z-index:90;pointer-events:none}
.statusbar .time{font:600 17px var(--sans);letter-spacing:-.01em}
.sicons{display:flex;align-items:center;gap:6px;fill:var(--ink);color:var(--ink)}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--ink);z-index:90;pointer-events:none}
.main{position:absolute;inset:0;transition:transform calc(420ms*var(--slow)) cubic-bezier(.2,.9,.25,1),filter calc(420ms*var(--slow))}
.main::after{content:"";position:absolute;inset:0 0 auto;height:calc(var(--top) + 72px);background:linear-gradient(var(--app) 74%,rgba(31,30,29,0));z-index:19;pointer-events:none}
.scroller{position:absolute;inset:0;overflow-y:auto;padding:calc(var(--top) + 70px) 16px 220px;scrollbar-width:none;touch-action:pan-y;overscroll-behavior:contain}
.scroller::-webkit-scrollbar{display:none}
.msg{transition:opacity calc(260ms*var(--slow))}
.msg-user{display:flex;justify-content:flex-end;margin:0 0 22px}
.bubble{max-width:272px;background:var(--raised);border-radius:22px;padding:12px 16px;font:400 16px/22px var(--sans)}
.bubble .bq{font:400 13px/18px var(--sans);color:var(--muted);border-left:2px solid var(--accent);padding-left:8px;margin-bottom:6px}
.msg-claude{margin:0 0 26px}
.ctext{font:400 17px/26px var(--serif);color:var(--ink);transition:transform calc(500ms*var(--slow)) cubic-bezier(.2,.9,.25,1)}
.ctext.pressing{transform:scale(.985)}
.actions{display:flex;gap:22px;margin-top:12px;color:var(--muted)}
.actions .ic{width:19px;height:19px}
.anchor{text-decoration:underline dotted var(--accent);text-decoration-thickness:2px;text-underline-offset:5px;cursor:pointer}
.anchor sup{font:600 10px var(--sans);color:var(--accent);margin-left:2px}
mark.hl{color:inherit;border-radius:4px;padding:1px 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.c-coral{--c:var(--hl-coral)}.c-amber{--c:var(--hl-amber)}.c-green{--c:var(--hl-green)}.c-blue{--c:var(--hl-blue)}.c-violet{--c:var(--hl-violet)}
mark.hl{background:color-mix(in srgb,var(--c) 30%,transparent)}
mark.hl.flash{animation:flash calc(1200ms*var(--slow)) ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--c) 85%,transparent)}100%{background:color-mix(in srgb,var(--c) 30%,transparent)}}
.dimmed .msg:not(.focus){opacity:.32}
.thread.blockpad{padding-bottom:460px}
.ctext.blocks{line-height:22px}
.blk{display:inline-block;margin:4px 1px;padding:4px 7px;border-radius:9px;background:transparent;transition:background calc(240ms*var(--slow)) ease,color calc(240ms*var(--slow)) ease,transform calc(240ms*var(--slow)) cubic-bezier(.2,1.4,.4,1);cursor:pointer}
.blk.on{background:rgba(255,255,255,.075)}
.blk.sel{background:var(--accent);color:#fff;transform:scale(1.03)}
.artifact{margin:16px 0 0;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.artifact canvas{display:block;width:100%;height:190px;background:#191817}
.artifact .meta{display:flex;align-items:center;gap:10px;padding:12px 14px;color:var(--muted)}
.artifact .meta b{display:block;font:500 14px var(--sans);color:var(--ink)}
.artifact .meta small{font:400 12px var(--sans)}
.merged{margin:-6px 0 26px;padding:12px 14px;border-radius:6px 16px 16px 6px;background:var(--accent-soft);border-left:3px solid var(--accent);overflow:hidden}
.merged .ml{display:flex;align-items:center;gap:6px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.merged .mq{font:400 13px/18px var(--sans);color:var(--muted);margin:6px 0 4px}
.merged .mqq{font:500 14px/20px var(--sans)}
.merged .ma{font:400 15px/22px var(--serif);margin-top:4px}
.pulse{animation:pulse calc(1600ms*var(--slow)) ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,119,87,0)}25%{box-shadow:0 0 0 6px rgba(217,119,87,.35)}100%{box-shadow:0 0 0 14px rgba(217,119,87,0)}}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* glass */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),0 18px 40px rgba(0,0,0,.45)}
.glass.strong{background:var(--glass-strong)}
.sheen{position:relative}
.sheen::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05))}
.topbar{position:absolute;top:var(--top);left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:20}
.gbtn{width:48px;height:48px;border-radius:24px;display:grid;place-items:center;flex:none}
.gbtn.sm{width:40px;height:40px;border-radius:20px;box-shadow:none}
.gpill{height:48px;border-radius:24px;display:flex;align-items:center;gap:6px;padding:0 18px 0 14px;font:500 15px var(--sans)}
.ggroup{height:48px;width:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;flex:none}
.ggroup button{width:42px;height:42px;display:grid;place-items:center}
.edge{position:absolute;right:0;top:47%;width:28px;padding:14px 0;border-radius:16px 0 0 16px;border-right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:15;font:600 12px var(--sans);font-variant-numeric:tabular-nums;box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.edge .ic{width:16px;height:16px}
.composer{position:absolute;left:16px;right:16px;bottom:var(--bot);border-radius:30px;padding:14px 12px 12px;z-index:25;overflow:hidden}
.qchip{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.qchip .bar{width:3px;align-self:stretch;background:var(--accent);border-radius:2px}
.qtext{flex:1;min-width:0;font:400 13px/18px var(--sans);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cin{display:block;width:100%;background:none;border:0;outline:0;color:var(--ink);font:400 18px var(--sans);padding:2px 4px 12px}
.cin::placeholder{color:var(--muted)}
.controls{display:flex;align-items:center;gap:8px}
.cbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none}
.cbtn.solid{background:var(--ink);color:var(--app)}
.model{height:40px;border-radius:20px;padding:0 14px;background:rgba(255,255,255,.06);font:500 14px var(--sans);display:flex;align-items:center;gap:5px}
.model span{color:var(--muted)}
.spacer{flex:1}

/* selection tray */
.tray{position:absolute;left:16px;right:16px;border-radius:26px;padding:12px 14px 14px 16px;z-index:24;touch-action:none;cursor:grab}
.tray .th{display:flex;align-items:center;gap:6px;font:400 12px var(--sans);color:var(--muted);min-height:28px}
.tray .th .ic{width:15px;height:15px}
.tray .th .q{color:var(--accent)}
.tlink{height:28px;padding:0 10px;border-radius:14px;background:rgba(255,255,255,.08);font:500 12.5px var(--sans);color:var(--ink)}
#trayClose{width:28px;height:28px;display:grid;place-items:center}
.ttext{font:400 16px/23px var(--serif);margin:6px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ttext.empty{color:var(--muted);font-style:italic}
.needsel{display:flex;flex-direction:column;gap:10px;transition:opacity .2s}
.tray.nosel .needsel{opacity:.35;pointer-events:none}
.tools{display:flex;align-items:center;gap:8px}
.tl{font:400 12px var(--sans);color:var(--muted)}
.swatches{display:flex;gap:6px}
.sw{width:24px;height:24px;border-radius:12px;background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2);transition:transform .15s}
.sw:active{transform:scale(.85)}
.tsave{height:30px;padding:0 12px 0 10px;border-radius:15px;background:rgba(255,255,255,.08);display:flex;align-items:center;gap:5px;font:500 12.5px var(--sans)}
.tsave .ic{width:15px;height:15px}
.hints{display:flex;gap:8px}
.hint{flex:1;height:34px;border-radius:17px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;gap:6px;font:500 12.5px var(--sans);transition:background .2s,color .2s}
.hint .ic{width:15px;height:15px;color:var(--muted)}
.hint.active{background:var(--accent);color:#fff}
.hint.active .ic{color:#fff}

/* mini chat */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.34);z-index:28;opacity:0;pointer-events:none;transition:opacity calc(320ms*var(--slow))}
.dim.on{opacity:1;pointer-events:auto}
.mini{position:absolute;left:10px;right:10px;bottom:10px;border-radius:46px;z-index:30;padding:8px 0 12px;display:flex;flex-direction:column;gap:12px;background:rgba(44,43,40,.74)}
.grab{height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.grab i{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.28)}
.mhead{display:flex;align-items:center;gap:10px;padding:0 14px 0 22px}
.mhead .ic.a{color:var(--accent)}
.mhead div{flex:1;min-width:0}
.mhead b{display:block;font:600 17px var(--sans)}
.mhead small{font:400 12px var(--sans);color:var(--muted)}
.mquote{display:flex;gap:10px;margin:0 20px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.06)}
.mquote .bar{width:3px;border-radius:2px;background:var(--accent);flex:none}
.mquote p{margin:0;font:400 15px/21px var(--serif)}
.mthread{margin:0 20px;max-height:236px;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:12px}
.mthread:empty{display:none}
.mthread .bubble{align-self:flex-end;font-size:15px;padding:10px 14px;background:rgba(255,255,255,.1)}
.mthread .ans{font:400 16px/24px var(--serif)}
.mdone{margin:0 20px;display:flex;flex-direction:column;gap:8px}
.mdone small{font:400 12px var(--sans);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:40px;border-radius:20px;padding:0 16px 0 13px;display:inline-flex;align-items:center;gap:7px;font:500 14px var(--sans);background:rgba(255,255,255,.07);border:1px solid var(--glass-line)}
.chip .ic{width:17px;height:17px}
.chip.primary{background:var(--ink);color:var(--app);border-color:var(--ink)}
.mcomp{display:flex;align-items:center;gap:8px;margin:2px 10px 0;padding:8px 8px 8px 18px;border-radius:30px;background:rgba(255,255,255,.07)}
.mcomp input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:400 17px var(--sans)}
.mcomp input::placeholder{color:var(--muted)}
.goo{position:absolute;inset:0;z-index:29;pointer-events:none;filter:url(#goo);opacity:0}
.blob{position:absolute;background:linear-gradient(180deg,#4A4844 0%,#363532 55%,#2F2E2B 100%);border-radius:30px}
.fly{position:absolute;z-index:61;font:400 16px/23px var(--serif);color:var(--ink);white-space:nowrap;pointer-events:none;will-change:transform}

/* collapsed cards */
.search{height:44px;border-radius:22px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;padding:0 14px;margin-bottom:12px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:400 16px var(--sans)}
.search input::placeholder{color:var(--muted)}
.xcard{display:flex;width:100%;text-align:left;border-radius:20px;background:var(--surface);overflow:hidden;margin-bottom:10px}
.xcard .ind{width:4px;flex:none}
.xcard.cur{background:var(--raised)}
.xcard.cur .ind{background:var(--accent)}
.xcard .xb{flex:1;min-width:0;padding:14px 16px 14px 14px;display:flex;flex-direction:column;gap:6px}
.xtop{display:flex;align-items:center;gap:8px}
.xtop .i{font:400 12px var(--sans);color:var(--muted);font-variant-numeric:tabular-nums}
.xtop b{flex:1;min-width:0;font:500 14px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 7px;border-radius:11px;background:rgba(255,255,255,.07);font:500 12px var(--sans)}
.badge .ic{width:13px;height:13px;color:var(--muted)}
.hdots{display:inline-flex;gap:3px}
.hdots i{width:8px;height:8px;border-radius:4px;background:var(--c)}
.xs{font:400 12.5px/17px var(--sans);color:var(--muted)}
.kws{display:flex;gap:5px;flex-wrap:wrap}
.kws span{height:22px;padding:0 9px;border-radius:11px;background:rgba(255,255,255,.06);font:400 12px/22px var(--sans);color:var(--muted)}

/* panels */
.panel{position:absolute;inset:0;background:var(--app);z-index:40;transform:translateX(100%);transition:transform calc(420ms*var(--slow)) cubic-bezier(.2,.9,.25,1);will-change:transform}
.panel .scroller{padding-top:calc(var(--top) + 72px);padding-bottom:60px}
.panel .scroller.withbar{padding-bottom:150px}
.phead{position:absolute;top:var(--top);left:0;right:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;z-index:5}
.phead .tt{flex:1;min-width:0}
.phead b{display:block;font:600 17px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phead small{font:400 12px var(--sans);color:var(--muted)}
.panel::before{content:"";position:absolute;inset:0 0 auto;height:calc(var(--top) + 64px);background:linear-gradient(var(--app) 60%,rgba(31,30,29,0));z-index:4;pointer-events:none}
.seg{display:flex;padding:3px;border-radius:20px;background:rgba(255,255,255,.06);margin-bottom:14px}
.seg button{flex:1;height:34px;border-radius:17px;font:500 14px var(--sans);color:var(--muted)}

.bcard{border-radius:22px;background:var(--surface);padding:16px;margin-bottom:10px;cursor:pointer;transition:background .2s,box-shadow .2s}

.bbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bquote{font:400 12px var(--sans);color:var(--accent)}
.bq{font:400 16px/22px var(--sans)}
.bmeta{display:flex;align-items:center;justify-content:space-between;gap:8px;font:400 12px var(--sans);color:var(--muted)}
.bacts{display:grid;grid-template-rows:0fr;transition:grid-template-rows calc(300ms*var(--slow)) cubic-bezier(.2,.9,.25,1)}
.bcard.open .bacts{grid-template-rows:1fr}
.bacts>div{overflow:hidden}
.bacts .chips{padding:12px 0 0 38px}
.scard{display:flex;gap:12px;width:100%;text-align:left;border-radius:20px;background:var(--surface);padding:14px 16px;margin-bottom:10px}
.scard .sbar{width:4px;border-radius:2px;background:var(--c);flex:none}
.scard .st{display:block;font:400 16px/23px var(--serif)}
.scard .ss{display:block;font:400 12px/17px var(--sans);color:var(--muted);margin-top:6px}
.empty{font:400 15px/22px var(--serif);color:var(--muted);text-align:center;padding:50px 20px}

.bcomp{position:absolute;left:16px;right:16px;bottom:var(--bot);z-index:6;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 18px;border-radius:30px}

.label{font:400 12px var(--sans);color:var(--muted);margin:4px 0 10px}

.toast{position:absolute;left:50%;top:calc(var(--top) + 66px);transform:translate(-50%,-14px);opacity:0;z-index:70;border-radius:22px;padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font:500 14px var(--sans);white-space:nowrap;pointer-events:none;transition:opacity calc(240ms*var(--slow)),transform calc(240ms*var(--slow)) cubic-bezier(.2,1.2,.3,1)}

.finger{position:absolute;left:200px;top:500px;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.75);box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:95;pointer-events:none;opacity:0;transition:opacity .2s,transform .25s}

  { title: 'Mini chat: keep as a branch', d: 'The card drips into the branches tab; the phrase gets an anchor.', run: async (tok) => {
    await say('Not ready to merge? Keep it for later.', tok); await openMiniFast(tok); await say('<b>Make a branch</b>: the card drips into the branches tab…', tok);
    await tap(chipIn('[data-mact="branch"]'), tok); hideFinger(); await closeMini('branch', tok); await say('…and the phrase is underlined as an anchor you can tap later.', tok); await wait(2200, tok); } },
  { title: 'Mini chat: expand into a new chat', d: 'The card grows into a full conversation that carries the question with it.', run: async (tok) => {
    await openMiniFast(tok); await say('<b>New chat</b> expands the mini chat into a conversation of its own…', tok); await tap(chipIn('[data-mact="newchat"]'), tok); hideFinger(); await closeMini('newchat', tok); await wait(900, tok);
    await say('…with your selection and the side question already in it. Keep going here.', tok); const ni = $('#ncinput'); await tap(center(ni), tok); hideFinger(); await typeIn(ni, 'Plan a morning around this', tok); await sendNew(ni.value, tok); ni.value = ''; await wait(1400, tok);
    await say('<b>Back</b> returns you to the original chat, right where you left it.', tok); await tap(center($('#ncBack')), tok); hideFinger(); await closeNewChat(tok); await wait(1800, tok); } },
  { title: 'Mini chat: dissolve', d: 'Drag the card down; it condenses into a drop and falls back into the prompt bar.', run: async (tok) => {
    await openMiniFast(tok, false); await say('Done with it? Drag the card <b>down</b>…', tok); const g = center($('#grab'));
    await drag(g, { x: g.x, y: g.y + 140 }, 480, (e) => { mini.style.transform = `translateY(${140 * e}px)`; }, tok); hideFinger();
    await say('…it condenses into a <b>drop</b> and merges back into the prompt bar. Undo brings it back.', tok); await closeMini('dissolve', tok); await wait(2200, tok); } },
  { title: 'Swipe left: branches', d: 'Tap a branch to reveal its actions; sub-branches get their own page.', run: async (tok) => {
    await say('Swipe <b>left</b> to see this chat’s branches.', tok); renderBranches(); await drag({ x: 330, y: 470 }, { x: 60, y: 470 }, 620, (e) => setDrag(e), tok); clearDrag(); openBranches('branches'); hideFinger(); await wait(900, tok);
    await say('Tap a branch to reveal <b>Open, Merge and Dissolve</b>. Nothing appears on hover.', tok); await tap(center(branchesEl.querySelector('.bcard[data-b="b1"] .bq')), tok); toggleCard('b1'); hideFinger(); await wait(1600, tok);
    await say('Sub-branches open on their own page, so the list never nests.', tok); await tap(center(branchesEl.querySelector('[data-subs="b1"]')), tok); openSubs(S.branches[0]); hideFinger(); await wait(1700, tok);
    await tap(center(subEl.querySelector('[data-back]')), tok); scr.classList.remove('show-sub'); await wait(500, tok); await tap(center(branchesEl.querySelector('[data-back]')), tok); closeBranches(); hideFinger(); await wait(900, tok); } },
  { title: 'Chat inside a branch, then merge', d: 'Tap an anchor, keep talking in the branch, merge it in place.', run: async (tok) => {
    await say('Underlined phrases are <b>anchors</b>. Tap one to reopen its branch.', tok); const an = thread.querySelector('.anchor[data-b="b1"]'); await tap(center(an), tok); S.tab = 'branches'; renderBranches(); scr.classList.add('show-branches'); openThread(S.branches[0]); hideFinger(); await wait(1200, tok);
    await say('The branch has its own <b>prompt bar</b>, so you can keep exploring there.', tok); const bi = $('#binput'); await tap(center(bi), tok); hideFinger(); await typeIn(bi, 'Is there a separate ticket?', tok); await sendBranch(bi.value, tok); bi.value = ''; await wait(1200, tok);
    await say('When it’s useful, <b>Merge into main</b> puts it right under its source.', tok); await tap(center(subEl.querySelector('[data-tact="merge"]')), tok); hideFinger(); await mergeBranch(S.branches[0], true); await wait(700, tok);
    closeBranches(); await wait(450, tok); const m = thread.querySelector('.merged'); if (m) { scrollToMsg(m.dataset.id, 300); m.classList.remove('pulse'); void m.offsetWidth; m.classList.add('pulse'); } await wait(2000, tok); } },
  { hide: true, title: 'Collapse and expand', d: 'Fold the chat into cards, then open it back up.', run: async (tok) => {
    await say('Tap <b>Collapse</b> to fold the conversation into cards.', tok); await tap(center($('#viewPill')), tok); await collapse(tok); hideFinger(); await wait(2200, tok);
    await say('Tap <b>Expand</b> to open the full conversation again.', tok); await tap(center($('#viewPill')), tok); await expandTo(currentCard(), tok); hideFinger(); await wait(1800, tok); } },
  { hide: true, title: 'Select all', d: 'Hold an answer, then select the whole paragraph.', run: async (tok) => {
    const ct = msgEl('m4').querySelector('.ctext'); const r = rel(ct); const pt = { x: r.x + 150, y: r.y + 40 };
    await say('Press and hold an answer. It splits into <b>blocks</b>.', tok); await hold(pt, tok); enterBlock('m4', pt); hideFinger(); await wait(1000, tok);
    await say('<b>Select all</b> grabs the whole paragraph at once.', tok); await tap(center($('#selAll')), tok); selectAll(); hideFinger(); await wait(2200, tok); } },
  { hide: true, title: 'Select phrases', d: 'Hold an answer, then tap just the phrases you want.', run: async (tok) => {
    const ct = msgEl('m4').querySelector('.ctext'); const r = rel(ct); const pt = { x: r.x + 150, y: r.y + 40 };
    await say('Press and hold an answer. It splits into <b>blocks</b>.', tok); await hold(pt, tok); enterBlock('m4', pt); hideFinger(); await wait(1000, tok);
    await say('Tap just the phrases you want.', tok);
    for (const b of blkFor('m4', /^(by mid-morning|so arrive when|the gates open|at 8:30)/)) { await tap(center(b), tok); toggleBlock(+b.dataset.i); }
    hideFinger(); await say('The selection collects in a <b>glass tray</b> above the prompt bar.', tok); await wait(2200, tok); } },
];
let current = 0, loop = !EMBED || ONE !== null, playing = false;
async function play(i) {
  current = i; reset(); const tok = RUN; playing = true; scr.classList.add('demo'); renderRail();
  try {
    await wait(500, tok); await DEMOS[i].run(tok); hideFinger(); await wait(600, tok);
    if (tok === RUN && playing) play(loop ? i : (i + 1) % DEMOS.length);
  } catch (e) { if (!(e instanceof Abort)) console.error(e); }
}
function stopDemo() { playing = false; RUN++; scr.classList.remove('demo'); hideFinger(); renderRail(); caption.innerHTML = 'Your turn: hold an answer, swipe the tray, swipe left for branches.'; }

/* ---------- rail ---------- */
function renderRail() {
  const rail = $('#rail');
  if (MODE === 'present') {
    rail.innerHTML = `<div><div class="eyebrow">Motion study</div><h1>Anchored branching</h1><p class="lead">Every action in the mobile redesign, played on a loop. Turn on slow motion for recording.</p></div>
    <div class="list">${DEMOS.map((d, i) => d.hide ? '' : `<button class="item ${i === current && playing ? 'on' : ''}" data-demo="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span><span><b>${d.title}</b><span class="d">${d.d}</span></span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="slowBtn" aria-pressed="${SLOW > 1}">Slow motion</button><button class="btn" id="loopBtn" aria-pressed="${loop}">Loop this action</button><button class="btn" id="tryBtn">${playing ? 'Try it yourself' : 'Resume playback'}</button></div>`;
  } else {
    const n = Object.keys(done).length;
    rail.innerHTML = `<div><div class="eyebrow">Usability test</div><h1>Anchored branching</h1><p class="lead">Hand the phone to the participant and read each task aloud. Tasks tick themselves off when completed.</p></div>
    <div class="card"><h2>Tasks · ${n} of ${TASKS.length}</h2>${TASKS.map((k, i) => `<div class="task ${done[i] ? 'done' : ''}"><span class="box">${done[i] ? ic('check', 14) : ''}</span><span class="t">${esc(k.text)}</span><span class="time">${done[i] ? done[i] + 's' : ''}</span></div>`).join('')}</div>
    <div class="card"><h2>Event log</h2><div class="log" id="logBox">${LOG.length ? LOG.map((l) => `<div><span>${l.t}s</span><span>${esc(l.evt)}${l.detail ? ' · ' + esc(short(l.detail, 48)) : ''}</span></div>`).join('') : '<div><span>–</span><span>Waiting for the first interaction</span></div>'}</div></div>
    <div class="row"><button class="btn" id="copyBtn">Copy log</button><button class="btn" id="resetBtn">Reset session</button></div>
    <details class="card"><summary>Gesture reference for the moderator</summary><ul>
      <li><b>Press and hold</b> an answer to split it into blocks; tap blocks, or <b>Select all</b>.</li>
      <li>Tap a <b>color</b> or <b>Save</b> to keep a selection; it appears under <b>Saved</b> in the branches panel.</li>
      <li><b>Swipe the tray up</b> for a mini chat, <b>down</b> to quote it in the prompt bar. The tray buttons do the same.</li>
      <li><b>Swipe left</b> on the chat, or tap the edge tab, for branches. Open a branch to chat inside it.</li>
      <li><b>Collapse</b> in the top bar folds the chat into cards.</li>
      <li>Drag the mini chat’s handle <b>down</b> to dissolve it.</li></ul></details>`;
    const lb = $('#logBox'); lb.scrollTop = lb.scrollHeight;
  }
}
$('#rail').addEventListener('click', (e) => {
  const d = e.target.closest('[data-demo]'); if (d) return play(+d.dataset.demo);
  if (e.target.id === 'slowBtn') { SLOW = SLOW > 1 ? 1 : 2.5; document.documentElement.style.setProperty('--slow', SLOW); renderRail(); }
  if (e.target.id === 'loopBtn') { loop = !loop; renderRail(); }
  if (e.target.id === 'tryBtn') { playing ? stopDemo() : play(current); }
  if (e.target.id === 'resetBtn') { reset(); LOG.length = 0; for (const k in done) delete done[k]; renderRail(); }
  if (e.target.id === 'copyBtn') { const txt = LOG.map((l) => `${l.t}s\t${l.evt}\t${l.detail}`).join('\n'); navigator.clipboard.writeText(txt).then(() => toast('Log copied')).catch(() => { const r = document.createRange(); r.selectNodeContents($('#logBox')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Press Ctrl+C or ⌘C to copy'); }); }
});

/* ---------- layout ---------- */
function fit() {
  const wrap = $('#phoneWrap'); const ph = $('#phone');
  if (EMBED) {
    document.documentElement.classList.add('embed');
    SC = Math.min(innerWidth / 393, innerHeight / 852); ph.style.transform = `scale(${SC})`; wrap.style.height = 852 * SC + 'px'; return;
  }
  if (NATIVE) {
    document.documentElement.classList.add('native');
    const vw = document.documentElement.clientWidth || innerWidth; SC = vw / 393; scr.style.height = innerHeight / SC + 'px';
    ph.style.transform = `scale(${SC})`; wrap.style.height = innerHeight + 'px'; return;
  }
  if (BARE) {
    document.documentElement.classList.add('bare');
    SC = 1; scr.style.height = Math.max(640, Math.min(900, innerHeight - 56)) + 'px'; wrap.style.height = 'auto'; return;
  }
  const narrow = innerWidth < 520;
  const availW = wrap.clientWidth, availH = Math.max(420, innerHeight - (narrow ? 90 : 120));
  SC = Math.min(availW / 419, availH / 878, 1);
  ph.style.transform = `translateX(-50%) scale(${SC})`; ph.style.transformOrigin = 'top center'; ph.style.left = '50%';
  wrap.style.height = 878 * SC + 'px';
}
addEventListener('resize', () => { fit(); if (S.block) placeTray(); });
if (SLOWQ > 0 && SLOWQ <= 4) { SLOW = SLOWQ; document.documentElement.style.setProperty('--slow', SLOW); }
fit(); reset(); renderRail();
if (MODE === 'present') play(ONE !== null && DEMOS[ONE] ? ONE : 0); else caption.innerHTML = 'Try it: hold an answer, swipe the tray, swipe left for branches.';
// the portfolio page pauses embeds that are scrolled out of view
if (EMBED) addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data === 'pause' && playing) { playing = false; RUN++; hideFinger(); }
  else if (e.data === 'play' && !playing) play(current);
  else if (e.data && e.data.demo !== undefined && DEMOS[e.data.demo]) { RUN++; hideFinger(); play(e.data.demo); }
});

</script>
